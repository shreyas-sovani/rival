app = "rival-runner"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  RUNNER_SERVICES = "on"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "15s"
    method = "GET"
    path = "/api/live"
    timeout = "5s"

[mounts]
  source = "runner_data"
  destination = "/data"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
