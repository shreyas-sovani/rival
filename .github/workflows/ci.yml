name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: foundry-rs/foundry-toolchain@v1

      - uses: actions/cache@v4
        with:
          path: |
            ~/.foundry/cache
            contracts/cache
            contracts/out
          key: foundry-${{ runner.os }}-${{ hashFiles('contracts/foundry.toml', 'contracts/**/*.sol') }}
          restore-keys: foundry-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm forge:build
      - run: pnpm forge:test
      # Stub exits 3 until S-019 implements audit:egress.
      - run: pnpm audit:egress
        continue-on-error: true

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: pnpm backlog:verify
